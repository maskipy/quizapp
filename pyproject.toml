[project]
name = "quizapp-api"
version = "0.1.0"
description = "Real-time quiz and flashcard platform for algorithm learning, built with FastAPI, PostgreSQL, and Redis."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.2",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "sqlmodel>=0.0.42",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pycodestyle, pyflakes, import sort, pyupgrade, bugbear

[tool.ruff.lint.per-file-ignores]
# Alembic's own script.py.mako template always emits typing.Union/Sequence
# imports and an import order we don't control. F401 (unused imports) stays
# enabled here on purpose -- that one does catch real mistakes.
"migrations/versions/*.py" = ["I001", "UP035", "UP007"]

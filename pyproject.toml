[project]
name = "quizapp-api"
version = "0.1.0"
description = "Real-time quiz and flashcard platform for algorithm learning, built with FastAPI, PostgreSQL, and Redis."
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pycodestyle, pyflakes, import sort, pyupgrade, bugbear
